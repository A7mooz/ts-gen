name: release-please

on:
    workflow_dispatch:
jobs:
    release-please:
        runs-on: ubuntu-latest

        steps:
            - uses: googleapis/release-please-action@v3
              with:
                  release-type: node
                  package-name: release-please-action
                  bump-patch-for-minor-pre-major: true
                  token: ${{ secrets.RELEASE_TOKEN }}
